stages:
  - test
  - validate
  - deploy

test:
  image: python:3.12
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - pytest -v

validate_bundle:
  image: python:3.12
  stage: validate
  before_script:
    - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
  script:
    - databricks bundle validate -t dev
  rules:
    - if: '$DATABRICKS_HOST && $DATABRICKS_CLIENT_ID && $DATABRICKS_CLIENT_SECRET'

deploy_bundle:
  image: python:3.12
  stage: deploy
  before_script:
    - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
  script:
    - databricks bundle deploy -t dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DATABRICKS_HOST && $DATABRICKS_CLIENT_ID && $DATABRICKS_CLIENT_SECRET'

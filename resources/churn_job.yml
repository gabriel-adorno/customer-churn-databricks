resources:
  jobs:
    churn_pipeline:
      name: customer-churn-pipeline
      tasks:
        - task_key: run_churn_pipeline
          spark_python_task:
            python_file: ../src/churn_project/pipeline.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - scikit-learn
              - mlflow
              - pandas
              - numpy
